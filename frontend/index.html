<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Team Expense Tracker</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>Team Expense Tracker</h1>
  </header>

  <main>
    <section class="card">
      <h2 id="form-title">Add Expense</h2>
      <form id="expense-form">
        <input type="hidden" id="expense-id" />
        <label>Description <input id="description" required /></label>
        <label>Amount <input id="amount" type="number" step="0.01" min="0.01" required /></label>
        <label>Category <input id="category" required /></label>
        <label>Date <input id="date" type="date" required /></label>
        <label>Paid by <input id="paid_by" required /></label>
        <div class="actions">
          <button type="submit" id="submit-btn">Save</button>
          <button type="button" id="cancel-btn" hidden>Cancel</button>
        </div>
        <p id="message" class="message"></p>
      </form>
    </section>

    <section class="card">
      <h2>Expenses</h2>
      <div class="controls">
        <label>Filter by category
          <input id="filter-category" placeholder="e.g. food" />
        </label>
        <label>Sort by
          <select id="sort-by">
            <option value="date">Date</option>
            <option value="amount">Amount</option>
          </select>
        </label>
        <label>Order
          <select id="order">
            <option value="desc">Descending</option>
            <option value="asc">Ascending</option>
          </select>
        </label>
        <button id="refresh-btn">Refresh</button>
      </div>
      <table id="expenses-table">
        <thead>
          <tr><th>Date</th><th>Description</th><th>Category</th><th>Amount</th><th>Paid by</th><th></th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>

    <section class="card">
      <h2>Summary</h2>
      <div class="summary-grid">
        <div>
          <h3>Total per category</h3>
          <table id="summary-category"><tbody></tbody></table>
        </div>
        <div>
          <h3>Total per person</h3>
          <table id="summary-person"><tbody></tbody></table>
        </div>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
